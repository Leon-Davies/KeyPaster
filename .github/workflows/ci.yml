name: Windows CI and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build portable Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KeyPaster keypaster_app.py

      - name: Upload KeyPaster.exe
        uses: actions/upload-artifact@v4
        with:
          name: KeyPaster-Windows
          path: dist/KeyPaster.exe
          if-no-files-found: error
          retention-days: 30
